name: Codemagic Control Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  codemagic:
    if: >
      github.event.issue.title == '[Control] Codemagic' &&
      github.actor == 'rainbowwing0603-blip' &&
      startsWith(github.event.comment.body, '/codemagic ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
      CODEMAGIC_APP_ID: "6ac004de340f8afe81c6c461"
      CODEMAGIC_WORKFLOW_ID: ios-unsigned-check
      DEFAULT_BRANCH: feature/android-next-release

    steps:
      - name: Execute Codemagic command
        id: cm
        shell: bash
        run: |
          set -euo pipefail
          command_text="${{ github.event.comment.body }}"
          read -r _ action arg <<< "$command_text"

          if [ -z "${CODEMAGIC_API_TOKEN:-}" ]; then
            result="❌ CODEMAGIC_API_TOKEN is not configured."
          else
            api() {
              curl --fail-with-body --silent --show-error \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
                "$@"
            }

            case "$action" in
              ping)
                api "https://api.codemagic.io/apps/$CODEMAGIC_APP_ID" >/dev/null
                result="✅ Codemagic API connected. workflow: $CODEMAGIC_WORKFLOW_ID"
                ;;

              build)
                branch="${arg:-$DEFAULT_BRANCH}"
                payload="$(jq -nc --arg appId "$CODEMAGIC_APP_ID" --arg workflowId "$CODEMAGIC_WORKFLOW_ID" --arg branch "$branch" '{appId:$appId,workflowId:$workflowId,branch:$branch}')"
                response="$(api -X POST --data "$payload" https://api.codemagic.io/builds)"
                build_id="$(printf '%s' "$response" | jq -r '.buildId // empty')"

                if [[ ! "$build_id" =~ ^[0-9a-fA-F]{24}$ ]]; then
                  result="❌ Codemagic did not return a valid build ID."
                else
                  status="queued"
                  terminal='^(finished|failed|canceled|timeout|skipped)$'
                  for _ in {1..30}; do
                    sleep 20
                    response="$(api "https://codemagic.io/api/v3/builds/$build_id")"
                    status="$(printf '%s' "$response" | jq -r '.data.status // "unknown"')"
                    if [[ "$status" =~ $terminal ]]; then
                      break
                    fi
                  done
                  result="ℹ️ Codemagic build $build_id on $branch ended with status: $status"
                fi
                ;;

              status)
                if [[ ! "${arg:-}" =~ ^[0-9a-fA-F]{24}$ ]]; then
                  result="❌ Usage: /codemagic status <24-character-build-id>"
                else
                  response="$(api "https://codemagic.io/api/v3/builds/$arg")"
                  status="$(printf '%s' "$response" | jq -r '.data.status // "unknown"')"
                  result="ℹ️ Codemagic build $arg status: $status"
                fi
                ;;

              cancel)
                if [[ ! "${arg:-}" =~ ^[0-9a-fA-F]{24}$ ]]; then
                  result="❌ Usage: /codemagic cancel <24-character-build-id>"
                else
                  api -X POST "https://api.codemagic.io/builds/$arg/cancel" >/dev/null
                  result="🛑 Cancel requested for Codemagic build $arg."
                fi
                ;;

              *)
                result="❌ Unknown command. Use ping, build [branch], status <build-id>, or cancel <build-id>."
                ;;
            esac
          fi

          {
            echo 'result<<EOF'
            echo "$result"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Reply to control issue
        uses: actions/github-script@v8
        env:
          RESULT: ${{ steps.cm.outputs.result }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.RESULT
            })
