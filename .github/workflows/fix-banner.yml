name: Fix banner placement
on:
  push:
    branches: [refactor/modularize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix main.dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          imp = "import 'widgets/banner_ad_widget.dart';"
          if imp not in s:
              s = s.replace("import 'models/seichi.dart';", "import 'models/seichi.dart';\n" + imp, 1)
          start = s.find('      bottomNavigationBar:')
          end = s.find('  @override\n  void dispose', start)
          if start < 0 or end < 0:
              raise SystemExit('navigation block not found')
          block = """      bottomNavigationBar: Column(\n        mainAxisSize: MainAxisSize.min,\n        children: [\n          const BannerAdWidget(),\n          NavigationBar(\n            selectedIndex: _selectedTab,\n            onDestinationSelected: (index) {\n              setState(() {\n                _selectedTab = index;\n              });\n            },\n            destinations: const [\n              NavigationDestination(icon: Icon(Icons.map_outlined), selectedIcon: Icon(Icons.map), label: 'マップ'),\n              NavigationDestination(icon: Icon(Icons.flag_outlined), selectedIcon: Icon(Icons.flag), label: 'クエスト'),\n              NavigationDestination(icon: Icon(Icons.workspace_premium_outlined), selectedIcon: Icon(Icons.workspace_premium), label: 'スタンプ'),\n              NavigationDestination(icon: Icon(Icons.leaderboard_outlined), selectedIcon: Icon(Icons.leaderboard), label: 'ランキング'),\n              NavigationDestination(icon: Icon(Icons.person_outline), selectedIcon: Icon(Icons.person), label: 'マイページ'),\n            ],\n          ),\n        ],\n      ),\n    );\n  }\n\n"""
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet || (git commit -m "Fix AdMob banner placement" && git push)
