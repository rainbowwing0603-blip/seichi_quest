name: Flutter PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare temporary Android signing for build verification
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/app/ci-upload.jks \
            -storepass ci-build-only -keypass ci-build-only \
            -alias ci -dname "CN=CI Build" \
            -keyalg RSA -keysize 2048 -validity 1
          cat > android/key.properties <<'EOF'
          storePassword=ci-build-only
          keyPassword=ci-build-only
          keyAlias=ci
          storeFile=ci-upload.jks
          googleMapsApiKey=ci-placeholder-key
          EOF

      - name: Verify Android release bundle builds
        run: flutter build appbundle --release --no-pub

      - name: Upload UI gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: build/ui_gallery/*.png
          if-no-files-found: ignore
