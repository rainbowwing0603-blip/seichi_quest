name: Google Play API Retry

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download preserved AAB
        uses: actions/download-artifact@v4
        with:
          name: play-release-aab
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37073660036
          path: artifact

      - name: Verify preserved AAB
        run: |
          test -s artifact/app-release.aab
          ls -lh artifact/app-release.aab

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: jomokaruta
          workload_identity_provider: projects/152400953721/locations/global/workloadIdentityPools/seichi-quest-github/providers/seichi-quest-github
          service_account: seichi-quest-play-api@jomokaruta.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Diagnose Play bundle upload
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -u
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/jp.seichiquest.app"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}")

          edit_file="$(mktemp)"
          edit_code="$(curl -sS -o "$edit_file" -w '%{http_code}' -X POST "${auth[@]}" -H "Content-Type: application/json" "$api/edits" -d '{}')"
          echo "EDIT_HTTP_STATUS=$edit_code"
          if [[ ! "$edit_code" =~ ^2 ]]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("EDIT_ERROR="+str(d.get("error",{}).get("message","unknown")))' "$edit_file" || true
            exit 1
          fi
          edit_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$edit_file")"
          trap 'curl -sS -X DELETE "${auth[@]}" "$api/edits/${edit_id}" >/dev/null || true' EXIT

          out="$(mktemp)"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" --data-binary @artifact/app-release.aab "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/jp.seichiquest.app/edits/${edit_id}/bundles?uploadType=media")"
          echo "UPLOAD_HTTP_STATUS=$code"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); e=d.get("error",{}); print("PLAY_API_MESSAGE="+str(e.get("message",""))); print("PLAY_API_STATUS="+str(e.get("status",""))); print("PLAY_API_REASONS="+",".join(str(x.get("reason","")) for x in e.get("errors",[]))); print("VERSION_CODE="+str(d.get("versionCode","")))' "$out" || { echo "NON_JSON_RESPONSE"; head -c 1000 "$out"; echo; }

          if [[ "$code" =~ ^2 ]]; then
            echo "Bundle upload succeeded. This diagnostic workflow does not update any track or commit the edit."
            exit 0
          fi
          exit 1
