name: Google Play Test Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Test track only"
        required: true
        default: "alpha"
        type: choice
        options: [alpha, beta, internal]
      branch:
        description: "Branch to build and release"
        required: true
        default: "feature/android-next-release"
      release_status:
        description: "Play release status"
        required: true
        default: "completed"
        type: choice
        options: [draft, completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-test-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play-test-release
    steps:
      - name: Guard test-only release
        env:
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          case "$TRACK" in alpha|beta|internal) ;; *) echo "Production or unknown track is forbidden."; exit 1 ;; esac

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Restore Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_PROPERTIES"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          python3 -c 'from pathlib import Path; p=Path("android/key.properties"); lines=p.read_text().splitlines(); p.write_text("\n".join("storeFile=upload-keystore.jks" if x.startswith("storeFile=") else x for x in lines)+"\n")'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: jomokaruta
          workload_identity_provider: projects/152400953721/locations/global/workloadIdentityPools/seichi-quest-github/providers/seichi-quest-github
          service_account: seichi-quest-play-api@jomokaruta.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Resolve Play versionCode and build
        id: version
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          STORY_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID || secrets.ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID || 'ca-app-pub-1391846841313915/2032059471' }}
        run: |
          set -euo pipefail
          package="jp.seichiquest.app"
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$package"
          auth=(-H "Authorization: Bearer $ACCESS_TOKEN")

          version_name="$(python3 -c 'import re; s=open("pubspec.yaml", encoding="utf-8").read(); m=re.search(r"^version:\s+([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$", s, re.M); assert m, "pubspec.yaml must contain version: MAJOR.MINOR.PATCH (build number must not be managed manually)"; print(m.group(1))')"
          echo "Release versionName: $version_name"

          edit="$(curl -sS --fail-with-body -X POST "${auth[@]}" -H "Content-Type: application/json" "$api/edits" -d '{}')"
          edit_id="$(printf '%s' "$edit" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Play edit: $edit_id"

          bundles="$(curl -sS --fail-with-body "${auth[@]}" "$api/edits/$edit_id/bundles")"
          max_existing="$(printf '%s' "$bundles" | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[int(x["versionCode"]) for x in d.get("bundles",[])]; print(max(xs) if xs else 0)')"
          next_version_code=$((max_existing + 1))

          echo "Highest existing Play versionCode: $max_existing"
          echo "Automatically assigned next versionCode: $next_version_code"

          flutter pub get
          flutter analyze
          flutter test
          flutter build appbundle --release --build-name="$version_name" --build-number="$next_version_code" --dart-define="ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID=$STORY_REWARDED_AD_UNIT_ID"
          test -s build/app/outputs/bundle/release/app-release.aab

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$next_version_code" >> "$GITHUB_OUTPUT"
          echo "edit_id=$edit_id" >> "$GITHUB_OUTPUT"

      - name: Preserve release AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab-${{ github.run_id }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Publish to test track
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          EDIT_ID: ${{ steps.version.outputs.edit_id }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          package="jp.seichiquest.app"
          aab="build/app/outputs/bundle/release/app-release.aab"
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$package"
          auth=(-H "Authorization: Bearer $ACCESS_TOKEN")

          upload_http_code="$(curl -sS -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" --data-binary "@$aab" -o /tmp/play-upload-response.json -w "%{http_code}" "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$package/edits/$EDIT_ID/bundles?uploadType=media")"
          if [[ "$upload_http_code" != 2* ]]; then
            echo "Play API bundle upload HTTP $upload_http_code"
            cat /tmp/play-upload-response.json
            exit 1
          fi

          upload="$(cat /tmp/play-upload-response.json)"
          version_code="$(printf '%s' "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')"
          echo "Uploaded versionCode $version_code"

          if [[ "$version_code" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "::error::AAB versionCode $version_code does not match automatically assigned versionCode $EXPECTED_VERSION_CODE."
            exit 1
          fi

          body="$(VERSION_CODE="$version_code" RELEASE_STATUS="$RELEASE_STATUS" VERSION_NAME="$VERSION_NAME" python3 -c 'import json,os; print(json.dumps({"releases":[{"name":os.environ["VERSION_NAME"],"status":os.environ["RELEASE_STATUS"],"versionCodes":[os.environ["VERSION_CODE"]]}]}))')"
          echo "Play API: update $TRACK track"
          curl -sS --fail-with-body -X PUT "${auth[@]}" -H "Content-Type: application/json" "$api/edits/$EDIT_ID/tracks/$TRACK" -d "$body" >/dev/null

          echo "Play API: validate edit"
          curl -sS --fail-with-body -X POST "$api/edits/$EDIT_ID:validate" >/dev/null
          echo "Play API: commit edit"
          curl -sS --fail-with-body -X POST "$api/edits/$EDIT_ID:commit" >/dev/null

          echo "Published versionName $VERSION_NAME / versionCode $version_code to $TRACK with status $RELEASE_STATUS."
