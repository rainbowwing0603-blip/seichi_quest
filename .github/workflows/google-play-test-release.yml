name: Google Play Test Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Test track only"
        required: true
        default: "alpha"
        type: choice
        options: [alpha, beta, internal]
      branch:
        description: "Branch to build and release"
        required: true
        default: "main"
      release_status:
        description: "Play release status"
        required: true
        default: "completed"
        type: choice
        options: [draft, completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-test-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play-test-release
    steps:
      - name: Guard test-only release
        env:
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          case "$TRACK" in alpha|beta|internal) ;; *) echo "Production or unknown track is forbidden."; exit 1 ;; esac

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Restore Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_PROPERTIES"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          python3 -c 'from pathlib import Path; p=Path("android/key.properties"); lines=p.read_text().splitlines(); p.write_text("\n".join("storeFile=upload-keystore.jks" if x.startswith("storeFile=") else x for x in lines)+"\n")'

      - name: Validate and build
        env:
          STORY_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID || secrets.ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID || 'ca-app-pub-1391846841313915/2032059471' }}
        run: |
          set -euo pipefail
          test -n "$STORY_REWARDED_AD_UNIT_ID"
          flutter pub get
          flutter analyze
          flutter test
          flutter build appbundle --release --dart-define="ADMOB_ANDROID_STORY_REWARDED_AD_UNIT_ID=$STORY_REWARDED_AD_UNIT_ID"
          test -s build/app/outputs/bundle/release/app-release.aab
          echo "Rewarded story ad unit configured."

      - name: Preserve release AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab-${{ github.run_id }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: jomokaruta
          workload_identity_provider: projects/152400953721/locations/global/workloadIdentityPools/seichi-quest-github/providers/seichi-quest-github
          service_account: seichi-quest-play-api@jomokaruta.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Publish to test track
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          set -euo pipefail
          package="jp.seichiquest.app"
          aab="build/app/outputs/bundle/release/app-release.aab"
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$package"
          auth=(-H "Authorization: Bearer $ACCESS_TOKEN")

          edit="$(curl -sS --fail-with-body -X POST "${auth[@]}" -H "Content-Type: application/json" "$api/edits" -d '{}')"
          edit_id="$(printf '%s' "$edit" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          cleanup() { curl -sS -X DELETE "${auth[@]}" "$api/edits/$edit_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          upload="$(curl -sS --fail-with-body -X POST "${auth[@]}" -H "Content-Type: application/octet-stream" --data-binary "@$aab" "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$package/edits/$edit_id/bundles?uploadType=media")"
          version_code="$(printf '%s' "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')"
          echo "Uploaded versionCode $version_code"

          current_tracks="$(curl -sS --fail-with-body "${auth[@]}" "$api/edits/$edit_id/tracks")"
          max_existing="$(printf '%s' "$current_tracks" | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[int(v) for t in d.get("tracks",[]) for r in t.get("releases",[]) for v in r.get("versionCodes",[])]; print(max(xs) if xs else 0)')"
          echo "Highest existing Play versionCode: $max_existing"
          if (( version_code <= max_existing )); then
            echo "::error::Refusing release: AAB versionCode $version_code must be greater than existing Play versionCode $max_existing."
            exit 1
          fi

          body="$(VERSION_CODE="$version_code" RELEASE_STATUS="$RELEASE_STATUS" python3 -c 'import json,os; print(json.dumps({"releases":[{"status":os.environ["RELEASE_STATUS"],"versionCodes":[os.environ["VERSION_CODE"]]}]}))')"
          curl -sS --fail-with-body -X PUT "${auth[@]}" -H "Content-Type: application/json" "$api/edits/$edit_id/tracks/$TRACK" -d "$body" >/dev/null

          curl -sS --fail-with-body -X POST "${auth[@]}" "$api/edits/$edit_id:validate" >/dev/null
          curl -sS --fail-with-body -X POST "${auth[@]}" "$api/edits/$edit_id:commit" >/dev/null
          trap - EXIT

          echo "Published versionCode $version_code to $TRACK with status $RELEASE_STATUS."
