name: Implement collection history

on:
  push:
    branches:
      - refactor/modularize

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize
          fetch-depth: 0

      - name: Apply collection history and acquisition flow
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          s = s.replace("import 'dart:async';\n", "import 'dart:async';\nimport 'dart:convert';\n", 1)

          old = "  final Set<String> _collectedIds = {};\n\n  SharedPreferences? _preferences;"
          new = "  final Set<String> _collectedIds = {};\n\n  // 聖地ごとの獲得日時。端末内に保存して獲得履歴として表示する。\n  final Map<String, DateTime> _collectionHistory = {};\n\n  SharedPreferences? _preferences;"
          if old not in s:
              raise SystemExit('field marker not found')
          s = s.replace(old, new, 1)

          old = "    _collectedIds\n      ..clear()\n      ..addAll(savedIds);\n  }\n\n  Future<void> _saveStamps() async {\n    await _preferences?.setStringList(\n      'collected_seichi_ids',\n      _collectedIds.toList(),\n    );\n  }"
          new = "    _collectedIds\n      ..clear()\n      ..addAll(savedIds);\n\n    _collectionHistory.clear();\n    final history = _preferences?.getStringList('collection_history') ?? [];\n    for (final entry in history) {\n      try {\n        final decoded = jsonDecode(entry);\n        if (decoded is Map && decoded['id'] is String && decoded['at'] is String) {\n          final date = DateTime.tryParse(decoded['at'] as String);\n          if (date != null) {\n            _collectionHistory[decoded['id'] as String] = date;\n          }\n        }\n      } catch (_) {}\n    }\n  }\n\n  Future<void> _saveStamps() async {\n    await _preferences?.setStringList(\n      'collected_seichi_ids',\n      _collectedIds.toList(),\n    );\n    await _preferences?.setStringList(\n      'collection_history',\n      _collectionHistory.entries\n          .map((entry) => jsonEncode({\n                'id': entry.key,\n                'at': entry.value.toIso8601String(),\n              }))\n          .toList(),\n    );\n  }"
          if old not in s:
              raise SystemExit('save/load marker not found')
          s = s.replace(old, new, 1)

          old = "      _collectedIds.add(seichi.id);\n\n      if (_manualNextSeichiId == seichi.id) {"
          new = "      _collectedIds.add(seichi.id);\n      _collectionHistory[seichi.id] = DateTime.now();\n\n      if (_manualNextSeichiId == seichi.id) {"
          if old not in s:
              raise SystemExit('collect marker not found')
          s = s.replace(old, new, 1)

          marker = "  // ============================================================\n  // スタンプカード\n  // ============================================================\n"
          method = r'''  // ============================================================
  // 獲得履歴
  // ============================================================

  void _showCollectionHistory() {
    final history = _collectionHistory.entries
        .where((entry) => _collectedIds.contains(entry.key))
        .map((entry) {
          Seichi? seichi;
          for (final item in _seichiList) {
            if (item.id == entry.key) {
              seichi = item;
              break;
            }
          }
          return (seichi: seichi, at: entry.value);
        })
        .where((item) => item.seichi != null)
        .toList()
      ..sort((a, b) => b.at.compareTo(a.at));

    showModalBottomSheet<void>(
      context: context,
      showDragHandle: true,
      isScrollControlled: true,
      builder: (sheetContext) {
        return SafeArea(
          child: SizedBox(
            height: MediaQuery.of(sheetContext).size.height * 0.72,
            child: Column(
              children: [
                const Padding(
                  padding: EdgeInsets.fromLTRB(20, 4, 20, 12),
                  child: Row(
                    children: [
                      Icon(Icons.history_rounded),
                      SizedBox(width: 8),
                      Text(
                        '獲得履歴',
                        style: TextStyle(
                          fontSize: 22,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                ),
                Expanded(
                  child: history.isEmpty
                      ? const Center(
                          child: Text('まだ獲得履歴がありません。'),
                        )
                      : ListView.separated(
                          padding: const EdgeInsets.fromLTRB(16, 0, 16, 24),
                          itemCount: history.length,
                          separatorBuilder: (_, __) => const SizedBox(height: 8),
                          itemBuilder: (context, index) {
                            final item = history[index];
                            final seichi = item.seichi!;
                            final local = item.at.toLocal();
                            final date =
                                '${local.year}/${local.month.toString().padLeft(2, '0')}/${local.day.toString().padLeft(2, '0')} '
                                '${local.hour.toString().padLeft(2, '0')}:${local.minute.toString().padLeft(2, '0')}';
                            return Card(
                              elevation: 0,
                              child: ListTile(
                                leading: CircleAvatar(
                                  child: Text(seichi.card),
                                ),
                                title: Text('${seichi.icon} ${seichi.name}'),
                                subtitle: Text('${seichi.card}  •  $date'),
                                trailing: const Icon(
                                  Icons.verified_rounded,
                                  color: Colors.green,
                                ),
                                onTap: () {
                                  Navigator.pop(sheetContext);
                                  _moveCameraToSeichi(seichi);
                                },
                              ),
                            );
                          },
                        ),
                ),
              ],
            ),
          ),
        );
      },
    );
  }

  // ============================================================
  // スタンプカード
  // ============================================================
'''
          if marker not in s:
              raise SystemExit('history insertion marker not found')
          s = s.replace(marker, method, 1)

          old = "          _buildCollectionFilter(),\n          Expanded("
          new = "          _buildCollectionFilter(),\n          Padding(\n            padding: const EdgeInsets.fromLTRB(16, 0, 16, 10),\n            child: SizedBox(\n              width: double.infinity,\n              child: OutlinedButton.icon(\n                onPressed: _showCollectionHistory,\n                icon: const Icon(Icons.history_rounded),\n                label: const Text('獲得履歴を見る'),\n              ),\n            ),\n          ),\n          Expanded("
          if old not in s:
              raise SystemExit('history button marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement stamp acquisition history"
          git push origin refactor/modularize
