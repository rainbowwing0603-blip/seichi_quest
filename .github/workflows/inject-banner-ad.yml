name: Inject banner ad

on:
  push:
    branches:
      - refactor/modularize

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert BannerAdWidget into main.dart
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import 'widgets/banner_ad_widget.dart';"
          if import_line not in text:
              anchor = "import 'models/seichi.dart';"
              text = text.replace(anchor, anchor + "\n" + import_line, 1)

          old = """      bottomNavigationBar: NavigationBar(\n        selectedIndex: _selectedTab,"""
          new = """      bottomNavigationBar: Column(\n        mainAxisSize: MainAxisSize.min,\n        children: [\n          const BannerAdWidget(),\n          NavigationBar(\n            selectedIndex: _selectedTab,"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "const BannerAdWidget()" not in text:
              raise SystemExit('NavigationBar anchor not found')

          old_end = """        ],\n      ),\n    );"""
          new_end = """          ),\n        ],\n      ),\n    );"""
          if "const BannerAdWidget()" in text and new_end not in text:
              pos = text.rfind(old_end)
              if pos < 0:
                  raise SystemExit('Scaffold closing anchor not found')
              text = text[:pos] + new_end + text[pos + len(old_end):]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Display AdMob banner in app"
          git push
