name: Inject banner ad

on:
  push:
    branches:
      - refactor/modularize

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix and verify banner placement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import 'widgets/banner_ad_widget.dart';"
          if import_line not in text:
              anchor = "import 'models/seichi.dart';"
              text = text.replace(anchor, anchor + "\n" + import_line, 1)

          if "const BannerAdWidget()" not in text:
              old = "      bottomNavigationBar: NavigationBar(\n        selectedIndex: _selectedTab,"
              new = "      bottomNavigationBar: Column(\n        mainAxisSize: MainAxisSize.min,\n        children: [\n          const BannerAdWidget(),\n          NavigationBar(\n            selectedIndex: _selectedTab,"
              if old not in text:
                  raise SystemExit('NavigationBar anchor not found')
              text = text.replace(old, new, 1)

              old_end = "        ],\n      ),\n    );"
              new_end = "        ],\n          ),\n        ],\n      ),\n    );"
              pos = text.rfind(old_end)
              if pos < 0:
                  raise SystemExit('Scaffold closing anchor not found')
              text = text[:pos] + new_end + text[pos + len(old_end):]
          else:
              malformed = "        ],\n      ),\n    );"
              corrected = "        ],\n          ),\n        ],\n      ),\n    );"
              if malformed in text:
                  text = text.replace(malformed, corrected, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -q "import 'widgets/banner_ad_widget.dart';" lib/main.dart
          grep -q "const BannerAdWidget()" lib/main.dart

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix AdMob banner placement"
          git push
