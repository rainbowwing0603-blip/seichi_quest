name: seichi_quest
description: "位置情報を使って現地を巡り、イベントや地域のスポットを集める聖地巡礼クエストアプリ。"
publish_to: 'none'

version: 1.0.0
environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.3
  google_mobile_ads: ^9.1.0
  flutter_local_notifications: ^22.3.0
  sign_in_with_apple: ^8.2.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/collection_cards/travel_frame.png
    - assets/collection_cards/jomo_karuta_gunma_frame.png
    - assets/karuta/絵札/
    - assets/karuta/読み札/
    - assets/map_markers/marker_uncollected.png
    - assets/map_markers/marker_collected.png
    - assets/map_markers/marker_next.png

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
